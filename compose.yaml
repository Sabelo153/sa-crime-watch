services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_NAME: SA Crime Watch
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Generate APP_KEY in .env before starting}
      APP_URL: http://localhost:8000
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sa_crime_watch
      DB_USERNAME: watch
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SESSION_DRIVER: database
      CACHE_STORE: database
      LOG_CHANNEL: stderr
    volumes:
      - watch_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: sa_crime_watch
      MARIADB_USER: watch
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - watch_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  watch_db:
  watch_storage:
